<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Safari Funded Support Widget</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --navy: #0B0E1A;
    --navy-raised: #12162A;
    --gold: #C9A227;
    --gold-bright: #E3C158;
    --ember: #E8742F;
    --text-dim: #6b7280;
  }
  * { box-sizing: border-box; font-family: 'Inter', Arial, sans-serif; }
  html, body { margin: 0; background: transparent; height: 100%; overflow: hidden; }

  #bubble {
    position: fixed;
    bottom: 10px;
    right: 10px;
    width: 62px;
    height: 62px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--gold-bright), var(--ember));
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    box-shadow: 0 6px 20px rgba(232, 116, 47, 0.35), 0 2px 6px rgba(0,0,0,0.2);
    transition: transform 0.18s ease, box-shadow 0.18s ease;
    border: none;
  }
  #bubble:hover {
    transform: scale(1.06) translateY(-1px);
    box-shadow: 0 8px 24px rgba(232, 116, 47, 0.45), 0 3px 8px rgba(0,0,0,0.25);
  }
  #bubble svg { width: 26px; height: 26px; }

  #chat-window {
    position: fixed;
    bottom: 10px;
    right: 10px;
    width: 340px;
    height: 460px;
    background: white;
    border-radius: 16px;
    box-shadow: 0 12px 32px rgba(0,0,0,0.3);
    display: none;
    flex-direction: column;
    overflow: hidden;
    border: 1px solid rgba(0,0,0,0.06);
  }

  #chat-header {
    background: linear-gradient(135deg, var(--navy), #1a1f3a);
    color: white;
    padding: 16px 18px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 2px solid var(--gold);
  }
  #chat-header .title {
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 700;
    font-size: 15px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  #chat-header .title .dot {
    width: 8px; height: 8px;
    background: #4ADE80;
    border-radius: 50%;
    display: inline-block;
    box-shadow: 0 0 6px #4ADE80;
  }
  #chat-close {
    cursor: pointer;
    font-size: 16px;
    color: rgba(255,255,255,0.6);
    width: 24px; height: 24px;
    display: flex; align-items: center; justify-content: center;
    border-radius: 50%;
    transition: background 0.15s ease, color 0.15s ease;
  }
  #chat-close:hover { background: rgba(255,255,255,0.1); color: white; }

  #chat-messages {
    flex: 1;
    padding: 14px;
    overflow-y: auto;
    font-size: 14px;
    background: #FAFAF8;
  }

  .msg { margin-bottom: 12px; display: flex; }
  .msg.user { justify-content: flex-end; }
  .msg.ai { justify-content: flex-start; }

  .msg .bubble-text {
    display: inline-block;
    padding: 10px 14px;
    border-radius: 14px;
    max-width: 80%;
    line-height: 1.5;
  }
  .msg.user .bubble-text { background: var(--navy); color: white; border-bottom-right-radius: 4px; }
  .msg.ai .bubble-text { background: #EFEDE7; color: #23262F; border-bottom-left-radius: 4px; }
  .msg.ai .bubble-text strong { color: #8a6a12; }

  .msg .bubble-text strong { font-weight: 700; }
  .msg .bubble-text ul { margin: 6px 0; padding-left: 18px; }
  .msg .bubble-text li { margin-bottom: 4px; }
  .msg .bubble-text p { margin: 0 0 6px 0; }
  .msg .bubble-text p:last-child { margin-bottom: 0; }

  #chat-input-row {
    display: flex;
    border-top: 1px solid #e8e6df;
    background: white;
    padding: 8px;
    gap: 8px;
  }
  #chat-input {
    flex: 1;
    border: 1px solid #e0ddd3;
    border-radius: 10px;
    padding: 10px 14px;
    font-size: 14px;
    outline: none;
    transition: border-color 0.15s ease;
  }
  #chat-input:focus { border-color: var(--gold); }
  #chat-send {
    border: none;
    background: linear-gradient(135deg, var(--gold-bright), var(--ember));
    color: #14120A;
    font-weight: 600;
    font-size: 13px;
    padding: 0 18px;
    border-radius: 10px;
    cursor: pointer;
    transition: opacity 0.15s ease;
  }
  #chat-send:hover { opacity: 0.9; }
</style>
</head>
<body>

<div id="bubble" onclick="openChat()">
  <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
    <path d="M4 4h16a1 1 0 0 1 1 1v11a1 1 0 0 1-1 1H8l-4 4V6a1 1 0 0 1 1-1z" fill="#14120A"/>
    <circle cx="8" cy="10.5" r="1.1" fill="#E3C158"/>
    <circle cx="12" cy="10.5" r="1.1" fill="#E3C158"/>
    <circle cx="16" cy="10.5" r="1.1" fill="#E3C158"/>
  </svg>
</div>

<div id="chat-window">
  <div id="chat-header">
    <span class="title"><span class="dot"></span><span id="chat-title-text">Safari Funded Support</span></span>
    <span id="chat-close" onclick="closeChat()">✕</span>
  </div>
  <div id="chat-messages"></div>
  <div id="chat-input-row">
    <input id="chat-input" placeholder="Ask a question..." onkeypress="if(event.key==='Enter') sendMessage()" />
    <button id="chat-send" onclick="sendMessage()">Send</button>
  </div>
</div>

<script>
  // Tell the parent page (the host website) how big to make our iframe.
  // This is the trick that lets a small bubble expand into a full chat window
  // without the widget being trapped inside a tiny fixed box.
  function resizeParent(width, height) {
    window.parent.postMessage({ type: 'supportflow-resize', width, height }, '*');
  }

  // Read branding settings passed in via the embed script's data-attributes
  // (see embed.js), falling back to Safari Funded's own colors as sensible defaults.
  const params = new URLSearchParams(window.location.search);
  const businessName = params.get('name') || 'Safari Funded';
  const primaryColor = params.get('primary'); // e.g. dark navy
  const accentColor = params.get('accent');   // e.g. gold

  if (primaryColor) document.documentElement.style.setProperty('--navy', primaryColor);
  if (accentColor) {
    document.documentElement.style.setProperty('--gold', accentColor);
    document.documentElement.style.setProperty('--gold-bright', accentColor);
    document.documentElement.style.setProperty('--ember', accentColor);
  }
  document.getElementById('chat-title-text').textContent = businessName + ' Support';
  document.title = businessName + ' Support Widget';

  function openChat() {
    document.getElementById('bubble').style.display = 'none';
    document.getElementById('chat-window').style.display = 'flex';
    resizeParent('370px', '500px');
  }

  function closeChat() {
    document.getElementById('chat-window').style.display = 'none';
    document.getElementById('bubble').style.display = 'flex';
    resizeParent('70px', '70px');
  }

  function formatMessage(rawText) {
    const escapeHtml = (s) => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    const lines = rawText.split('\n');
    let html = '';
    let inList = false;

    for (let rawLine of lines) {
      const line = escapeHtml(rawLine).trim();
      const withBold = line.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
      const isBullet = /^[\*\-]\s+/.test(line);

      if (isBullet) {
        if (!inList) { html += '<ul>'; inList = true; }
        html += `<li>${withBold.replace(/^[\*\-]\s+/, '')}</li>`;
      } else {
        if (inList) { html += '</ul>'; inList = false; }
        if (line.length > 0) html += `<p>${withBold}</p>`;
      }
    }
    if (inList) html += '</ul>';
    return html || escapeHtml(rawText);
  }

  function addMessage(text, sender) {
    const messages = document.getElementById('chat-messages');
    const div = document.createElement('div');
    div.className = 'msg ' + sender;
    const span = document.createElement('span');
    span.className = 'bubble-text';
    if (sender === 'ai') {
      span.innerHTML = formatMessage(text);
    } else {
      span.textContent = text;
    }
    div.appendChild(span);
    messages.appendChild(div);
    messages.scrollTop = messages.scrollHeight;
  }

  async function sendMessage() {
    const input = document.getElementById('chat-input');
    const text = input.value.trim();
    if (!text) return;

    addMessage(text, 'user');
    input.value = '';
    addMessage('Typing...', 'ai');

    try {
      const res = await fetch('/api/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: text }),
      });
      const data = await res.json();
      const messages = document.getElementById('chat-messages');
      messages.removeChild(messages.lastChild);
      addMessage(data.answer || data.error || 'Something went wrong.', 'ai');
    } catch (err) {
      const messages = document.getElementById('chat-messages');
      messages.removeChild(messages.lastChild);
      addMessage('Connection error. Please try again.', 'ai');
    }
  }

  // Start collapsed, as just the bubble
  resizeParent('70px', '70px');
  addMessage("Hi! Ask me anything about Safari Funded's rules, payouts, or accounts.", 'ai');
</script>

</body>
</html>
