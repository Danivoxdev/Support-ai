<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Safari Funded Support</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --navy: #0B0E1A;
    --gold: #0d8b90;
    --gold-bright: #14b3ba;
    --ember: #0a6d70;
  }
  * { box-sizing: border-box; font-family: 'Inter', Arial, sans-serif; }
  body { margin: 0; background: #f4f4f4; }

  /* The floating round button */
  #bubble {
    position: fixed;
    bottom: 20px;
    right: 20px;
    width: 62px;
    height: 62px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--gold-bright), var(--ember));
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    box-shadow: 0 6px 20px rgba(232, 116, 47, 0.35), 0 2px 6px rgba(0,0,0,0.2);
    transition: transform 0.18s ease, box-shadow 0.18s ease;
    border: none;
  }
  #bubble:hover {
    transform: scale(1.06) translateY(-1px);
    box-shadow: 0 8px 24px rgba(232, 116, 47, 0.45), 0 3px 8px rgba(0,0,0,0.25);
  }
  #bubble svg { width: 26px; height: 26px; }

  /* The chat window, hidden until bubble is clicked */
  #chat-window {
    position: fixed;
    bottom: 90px;
    right: 20px;
    width: 340px;
    height: 460px;
    background: white;
    border-radius: 16px;
    box-shadow: 0 12px 32px rgba(0,0,0,0.3);
    display: none;
    flex-direction: column;
    overflow: hidden;
    border: 1px solid rgba(0,0,0,0.06);
  }

  #chat-header {
    background: linear-gradient(135deg, var(--navy), #1a1f3a);
    color: white;
    padding: 16px 18px;
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 700;
    font-size: 15px;
    display: flex;
    align-items: center;
    gap: 8px;
    border-bottom: 2px solid var(--gold);
  }
  #chat-header .dot {
    width: 8px; height: 8px;
    background: #4ADE80;
    border-radius: 50%;
    display: inline-block;
    box-shadow: 0 0 6px #4ADE80;
  }

  #chat-messages {
    flex: 1;
    padding: 14px;
    overflow-y: auto;
    font-size: 14px;
    background: #FAFAF8;
  }

  .msg { margin-bottom: 12px; display: flex; }
  .msg.user { justify-content: flex-end; }
  .msg.ai { justify-content: flex-start; }

  .msg .bubble-text {
    display: inline-block;
    padding: 10px 14px;
    border-radius: 14px;
    max-width: 80%;
    line-height: 1.5;
  }
  .msg.user .bubble-text { background: var(--navy); color: white; border-bottom-right-radius: 4px; }
  .msg.ai .bubble-text { background: #EFEDE7; color: #333333; border-bottom-left-radius: 4px; }
  .msg.ai .bubble-text strong { color: #8a6a12; }

  .msg .bubble-text strong { font-weight: 700; }
  .msg .bubble-text ul { margin: 6px 0; padding-left: 18px; }
  .msg .bubble-text li { margin-bottom: 4px; }
  .msg .bubble-text p { margin: 0 0 6px 0; }
  .msg .bubble-text p:last-child { margin-bottom: 0; }

  #chat-input-row {
    display: flex;
    border-top: 1px solid #e8e6df;
    background: white;
    padding: 8px;
    gap: 8px;
  }
  #chat-input {
    flex: 1;
    border: 1px solid #e0ddd3;
    border-radius: 10px;
    padding: 10px 14px;
    font-size: 14px;
    outline: none;
    transition: border-color 0.15s ease;
  }
  #chat-input:focus { border-color: var(--gold); }
  #chat-send {
    border: none;
    background: linear-gradient(135deg, var(--gold-bright), var(--ember));
    color: #14120A;
    font-weight: 600;
    font-size: 13px;
    padding: 0 18px;
    border-radius: 10px;
    cursor: pointer;
    transition: opacity 0.15s ease;
  }
  #chat-send:hover { opacity: 0.9; }

  /* Typing indicator — three bouncing dots */
  .typing-dots {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 4px 2px;
  }
  .typing-dots span {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: #9a9890;
    animation: typing-bounce 1.2s infinite ease-in-out;
  }
  .typing-dots span:nth-child(1) { animation-delay: 0s; }
  .typing-dots span:nth-child(2) { animation-delay: 0.15s; }
  .typing-dots span:nth-child(3) { animation-delay: 0.3s; }
  @keyframes typing-bounce {
    0%, 60%, 100% { transform: translateY(0); opacity: 0.5; }
    30% { transform: translateY(-4px); opacity: 1; }
  }
</style>
</head>
<body>

<div id="bubble" onclick="toggleChat()">
  <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
    <path d="M4 4h16a1 1 0 0 1 1 1v11a1 1 0 0 1-1 1H8l-4 4V6a1 1 0 0 1 1-1z" fill="#14120A"/>
    <circle cx="8" cy="10.5" r="1.1" fill="#14b3ba"/>
    <circle cx="12" cy="10.5" r="1.1" fill="#14b3ba"/>
    <circle cx="16" cy="10.5" r="1.1" fill="#14b3ba"/>
  </svg>
</div>

<div id="chat-window">
  <div id="chat-header"><span class="dot"></span>Safari Funded Support</div>
  <div id="chat-messages"></div>
  <div id="chat-input-row">
    <input id="chat-input" placeholder="Ask a question..." onkeypress="if(event.key==='Enter') sendMessage()" />
    <button id="chat-send" onclick="sendMessage()">Send</button>
  </div>
</div>

<script>
  function toggleChat() {
    const win = document.getElementById('chat-window');
    win.style.display = win.style.display === 'flex' ? 'none' : 'flex';
  }

  // Turns simple Markdown (the style the AI writes in) into safe, readable HTML.
  // Handles: **bold**, bullet lines starting with * or -, and paragraph breaks.
  function formatMessage(rawText) {
    // Escape HTML first so nothing malicious/broken sneaks in
    const escapeHtml = (s) =>
      s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

    const lines = rawText.split('\n');
    let html = '';
    let inList = false;

    for (let rawLine of lines) {
      const line = escapeHtml(rawLine).trim();

      // Bold: **text** -> <strong>text</strong>
      const withBold = line.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');

      const isBullet = /^[\*\-]\s+/.test(line);

      if (isBullet) {
        if (!inList) {
          html += '<ul>';
          inList = true;
        }
        const bulletText = withBold.replace(/^[\*\-]\s+/, '');
        html += `<li>${bulletText}</li>`;
      } else {
        if (inList) {
          html += '</ul>';
          inList = false;
        }
        if (line.length > 0) {
          html += `<p>${withBold}</p>`;
        }
      }
    }
    if (inList) html += '</ul>';

    return html || escapeHtml(rawText);
  }

  function addMessage(text, sender) {
    const messages = document.getElementById('chat-messages');
    const div = document.createElement('div');
    div.className = 'msg ' + sender;
    const span = document.createElement('span');
    span.className = 'bubble-text';

    if (sender === 'ai') {
      span.innerHTML = formatMessage(text);
    } else {
      span.textContent = text; // user's own text never needs formatting
    }

    div.appendChild(span);
    messages.appendChild(div);
    messages.scrollTop = messages.scrollHeight;
  }

  // Shows an animated three-dot "typing..." bubble instead of plain text,
  // to feel more like a real live conversation while waiting for a response.
  function addTypingIndicator() {
    const messages = document.getElementById('chat-messages');
    const div = document.createElement('div');
    div.className = 'msg ai';
    div.id = 'typing-indicator';
    div.innerHTML = `
      <span class="bubble-text">
        <span class="typing-dots"><span></span><span></span><span></span></span>
      </span>`;
    messages.appendChild(div);
    messages.scrollTop = messages.scrollHeight;
  }

  function removeTypingIndicator() {
    const indicator = document.getElementById('typing-indicator');
    if (indicator) indicator.remove();
  }

  async function sendMessage() {
    const input = document.getElementById('chat-input');
    const text = input.value.trim();
    if (!text) return;

    addMessage(text, 'user');
    input.value = '';
    addTypingIndicator();

    try {
      const res = await fetch('/api/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: text }),
      });
      const data = await res.json();
      removeTypingIndicator();
      addMessage(data.answer || data.error || 'Something went wrong.', 'ai');
    } catch (err) {
      removeTypingIndicator();
      addMessage('Connection error. Please try again.', 'ai');
    }
  }

  // Greet the customer when chat opens for the first time
  addMessage("Hi! Ask me anything about Safari Funded's rules, payouts, or accounts.", 'ai');
</script>

</body>
</html>
